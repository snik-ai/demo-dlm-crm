version: "3.9"

# DLM Digital — Sales Infrastructure
# Deploy via Coolify on Hetzner
# All services on demo.dlm-digital.ch:
#   /         → demo landing + individual demos (nginx static)
#   /admin    → CEO approval dashboard
#   /crm      → CRM Opportunity Tracker
#   /rechner  → Solar/Konfigurator tools

services:

  # ── Demo hosting (static nginx) ─────────────────────────────────────────────
  demos:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ../demo-generator/output:/usr/share/nginx/html:ro
      - ../rechner:/usr/share/nginx/html/rechner:ro
      - ./nginx/demos.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    labels:
      - "coolify.hostname=demo.dlm-digital.ch"

  # ── CEO Dashboard ──────────────────────────────────────────────────────────
  dashboard:
    build: ./dashboard
    restart: unless-stopped
    environment:
      PORT: 3001
      RESEND_API_KEY: ${RESEND_API_KEY}
      FROM_EMAIL: ${FROM_EMAIL:-marc@dlm-digital.ch}
      REPLY_TO_EMAIL: ${REPLY_TO_EMAIL:-sales@dlm-digital.ch}
      ADMIN_SECRET: ${ADMIN_SECRET}
      CRM_URL: http://crm:3002
      CRM_SECRET: ${ADMIN_SECRET}
    volumes:
      - dashboard_data:/app/data
    ports:
      - "3001:3001"
    labels:
      - "coolify.hostname=demo.dlm-digital.ch"
      - "coolify.path=/admin"

  # ── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: ${POSTGRES_USER:-dlm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dlm} -d crm"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── CRM Opportunity Tracker ────────────────────────────────────────────────
  crm:
    build: ../crm
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3002
      DATABASE_URL: postgres://${POSTGRES_USER:-dlm}:${POSTGRES_PASSWORD}@postgres:5432/crm
      ADMIN_SECRET: ${ADMIN_SECRET}
    ports:
      - "3002:3002"
    labels:
      - "coolify.hostname=demo.dlm-digital.ch"
      - "coolify.path=/crm"

  # ── Inbound Email Poller (sales@dlm-digital.ch) ──────────────────────────
  email-infra:
    build: ./email-infra
    restart: unless-stopped
    environment:
      IMAP_HOST: ${IMAP_HOST:-mail.infomaniak.com}
      IMAP_PORT: ${IMAP_PORT:-993}
      IMAP_USER: ${IMAP_USER:-sales@dlm-digital.ch}
      IMAP_PASS: ${IMAP_PASS}
      CRM_URL: http://crm:3002
      CRM_SECRET: ${ADMIN_SECRET}
      PAPERCLIP_API_URL: ${PAPERCLIP_API_URL:-http://host.docker.internal:3100}
      PAPERCLIP_API_KEY: ${PAPERCLIP_API_KEY}
      PAPERCLIP_COMPANY_ID: ${PAPERCLIP_COMPANY_ID}
      PAPERCLIP_GOAL_ID: ${PAPERCLIP_GOAL_ID}
      CHIEF_OF_SALES_AGENT_ID: ${CHIEF_OF_SALES_AGENT_ID}
      POLL_INTERVAL_MIN: ${POLL_INTERVAL_MIN:-5}
      SEEN_FILE: /app/data/email-infra-seen.json
    volumes:
      - email_infra_data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── Telegram Bot ──────────────────────────────────────────────────────────
  telegram-bot:
    build: ../telegram-bot
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      PAPERCLIP_API_URL: ${PAPERCLIP_API_URL:-http://host.docker.internal:3100}
      PAPERCLIP_API_KEY: ${PAPERCLIP_API_KEY}
      PAPERCLIP_COMPANY_ID: ${PAPERCLIP_COMPANY_ID}
      CEO_ISSUE_ID: ${CEO_ISSUE_ID}
      BUDGET_ALERT_PCT: ${BUDGET_ALERT_PCT:-80}
      DAILY_SUMMARY_HOUR: ${DAILY_SUMMARY_HOUR:-8}
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  dashboard_data:
  pg_data:
  email_infra_data:
